[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "accessdesk"
version = "1.0.0"
description = "Accessible, just-in-time access requests for employees: policy-routed approvals, auto-expiring grants and a tamper-evident audit log."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Shishir Garg" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "httpx2>=2.0",
    "playwright>=1.45",
    "axe-playwright-python>=0.1.4",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
accessdesk = "accessdesk.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
accessdesk = ["web/templates/*.html", "web/static/*.css", "web/static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["a11y: browser-based accessibility tests (need a Playwright browser)"]
filterwarnings = ["error::DeprecationWarning:accessdesk.*"]

[tool.coverage.run]
source = ["accessdesk"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF", "PT", "C4"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"scripts/**" = ["S108", "S603"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/accessdesk"]

[[tool.mypy.overrides]]
module = ["prometheus_client.*"]
ignore_missing_imports = true
