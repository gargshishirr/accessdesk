# Render Blueprint — https://render.com/docs/blueprint-spec
# Runs AccessDesk as a public DEMO on Render's free plan: anyone can sign in as anyone, and the SQLite
# database starts again with fresh demo data whenever the service restarts or wakes from sleep.
# For real use (company single sign-on and a persistent disk), follow "Run it on Render" in GUIDE.md.
services:
  - type: web
    name: accessdesk
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: python -m accessdesk serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: ACCESSDESK_SECURE_COOKIES
        value: "true"
      - key: ACCESSDESK_SECRET_KEY
        generateValue: true
      - key: ACCESSDESK_API_KEY
        generateValue: true
      # Cloudflare, in front of every Render service, puts each visitor's address in this header and
      # overwrites any value a visitor sends, so rate limits count visitors separately.
      - key: ACCESSDESK_CLIENT_IP_HEADER
        value: CF-Connecting-IP
