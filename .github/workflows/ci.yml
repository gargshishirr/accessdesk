name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # every Monday: catch newly published vulnerabilities and breaking releases

permissions:
  contents: read

jobs:
  test:
    name: Lint, types and tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -m "not a11y" --cov --cov-report=term --cov-fail-under=90

  accessibility:
    name: Accessibility (axe-core, keyboard, reflow, forced colours)
    runs-on: ubuntu-latest
    env:
      A11Y_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: playwright install --with-deps chromium
      - run: pytest -m a11y

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" pip-audit
      # Every installed package, the app's and the tools', against the PyPI and OSV advisory databases.
      - run: pip-audit --skip-editable --progress-spinner off

  docker:
    name: Docker image (build and smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t accessdesk .
      - name: Start the container and check it answers
        run: |
          docker run -d --name accessdesk -p 8000:8000 accessdesk
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/signin | grep -q "anyone can sign in as anyone"
          test "$(docker exec accessdesk id -u)" = "10001"
          docker exec accessdesk accessdesk verify-audit
      - name: Container logs
        if: always()
        run: docker logs accessdesk
